name: Website pipeline preview
on:
  push:
    paths: ['factory/site_*.py', 'factory/release_schema.py', 'scripts/check-package.py', 'scripts/site-*.py', 'sites/**', 'config/sites.json', 'release/**', '.github/workflows/site-preview.yml']
  pull_request:
    paths: ['factory/site_*.py', 'factory/release_schema.py', 'scripts/check-package.py', 'scripts/site-*.py', 'sites/**', 'config/sites.json', 'release/**', '.github/workflows/site-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s tests -p test_sites.py -v
      # Every release package that has an editorial file, rather than one named dataset: this
      # workflow used to preview a single dataset, so a second one was never exercised in CI.
      # Rejected private fixtures must refuse; unexpected failures AND passes fail CI.
      - run: python3 scripts/site-preview-all.py --out .factory/site-review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-publication-review
          path: .factory/site-review
          retention-days: 7
