name: Local checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m factory doctor
      - run: python3 scripts/check-runtime.py --source-only
      - run: python3 scripts/check-suitability.py
      - run: python3 scripts/operational-state.py --check --base "$STATE_BASE_SHA"
        env:
          STATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
